# dsh-github-trending profile bundle patch
# `name` 是宿主 import() 用的模块标识符，必须与 npm 包名一致。
# `id` 是 cordis 配置树内的键，与插件导出的插件名保持一致。
#
# config 只放「安装形态」相关的覆盖项；用户设置（模型 / 仓库 / 调度等）在
# $DSH_HOME/github-trending/settings.json，由设置页写入，不进 profile 补丁。
- insert:
    - id: dsh-github-trending
      name: '@morehao/dsh-github-trending'
      config: {}
