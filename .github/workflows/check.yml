name: check

# PR / main 上的机械校验：与发版链路同一套命令，把「只有发版才暴露」的错误前移。
# 产物（lib/、client.js）不入库，由 `npm run check` 现场构建。
on:
  pull_request:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    name: Pre-publish checks
    # 镜像显式钉版本：校验结果不该随 latest 漂移。
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 产物统一由 `npm run check` 构建一次，不走 setup-node 的依赖缓存。
          package-manager-cache: false

      - name: 安装依赖（跳过 prepare/pretest 的重复构建）
        run: npm ci --ignore-scripts

      - name: 发布脚本语法
        run: bash -n scripts/ci-publish.sh

      - name: 机械校验（typecheck + 契约 + 构建 + 测试）
        run: npm run check

      - name: AC-P 机械检查
        run: node scripts/ac/run.mjs
