name: check

# PR / main 上的机械校验：与发版链路同一套命令，把「只有发版才暴露」的错误前移。
# 产物（lib/、client.js）不入库，由 `npm run check` 现场构建。
# 门禁全部收敛在 `npm run check` 里（含 AC-P），YAML 只调用它——本地与 CI 跑的是同一串脚本。
on:
  pull_request:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    name: Pre-publish checks
    # 镜像显式钉版本：校验结果不该随 latest 漂移。
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # CI 主支持线（engines 另放行 >=24，但不在 CI 覆盖）；v7 下 22 的日志是干净的。
          node-version: '22'
          # 产物统一由 `npm run check` 构建一次，不走 setup-node 的依赖缓存。
          package-manager-cache: false

      - name: 安装依赖（跳过 prepare/pretest 的重复构建）
        run: npm ci --ignore-scripts

      - name: 发布脚本语法
        run: bash -n scripts/ci-publish.sh

      # 语法 → 类型（src + client）→ lockfile 注册表 → 契约快照 → 构建
      # → 命名/接线 → 打包白名单 → Release 正文投影冒烟 → 单测 → AC-P 机械检查。
      - name: 机械校验（npm run check）
        run: npm run check
